<main class="page">
  <h1 class="title">Turing Machine Simulator</h1>

  <div class="tape-container" [class.dual-mode]="dualTapeMode()">
    <app-tape [input]="inputValue()"></app-tape>
    @if (dualTapeMode()) {
      <app-tape [input]="inputValue()"></app-tape>
    }
  </div>

  <div class="toggle-slider-container">
    <label class="toggle-slider">
      <input
        type="checkbox"
        [checked]="dualTapeMode()"
        (change)="toggleDualTapeMode()"
        class="toggle-slider-input"
      >
      <span class="slider">
        <span class="slider-text">{{ dualTapeMode() ? 'Dual' : 'Single' }}</span>
      </span>
    </label>
  </div>

  <div class="bottom-section">
    <div class="examples-column">
      <app-examples (exampleSelected)="onExampleSelected($event)"></app-examples>
    </div>
    <div class="input-column">
      <textarea
        class="input-area"
        placeholder="Enter input for the Turing machine"
        [value]="inputValue()"
        (input)="onInputChange($any($event.target).value)"
      ></textarea>
    </div>
  </div>
</main>
